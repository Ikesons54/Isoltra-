<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1200" role="img" aria-labelledby="title desc">
  <title id="title">Isoltra logo</title>
  <desc id="desc">Premium gold spiral emblem with a blue focal dot, Isoltra wordmark, and Music in sync. Worship in flow. tagline.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1A8"/>
      <stop offset=".28" stop-color="#FFD34F"/>
      <stop offset=".58" stop-color="#C98A00"/>
      <stop offset=".82" stop-color="#FFD95A"/>
      <stop offset="1" stop-color="#A96800"/>
    </linearGradient>
    <radialGradient id="blue" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#7DEBFF"/>
      <stop offset=".45" stop-color="#18BFFF"/>
      <stop offset="1" stop-color="#075DFF"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1024" height="1200" rx="64" fill="#050608"/>

  <!-- Flowing circular ribbons -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" filter="url(#shadow)">
    <path d="M176 445 C214 236 390 128 604 166 C792 199 900 346 859 500 C826 624 712 708 575 720" stroke-width="34"/>
    <path d="M202 570 C129 381 246 207 447 175 C640 144 820 245 845 407 C866 545 787 657 671 719" stroke-width="30"/>
    <path d="M292 708 C164 597 171 406 293 294 C425 174 637 190 754 309 C848 405 841 554 768 650" stroke-width="27"/>
    <path d="M401 752 C258 706 204 552 259 416 C320 264 506 213 659 278 C786 332 833 456 797 565" stroke-width="24"/>
    <path d="M533 754 C389 776 272 684 256 553 C238 406 351 295 494 284 C632 273 748 365 768 492" stroke-width="21"/>
    <path d="M638 694 C535 758 398 718 354 611 C311 506 372 390 478 357 C575 327 678 378 709 468" stroke-width="18"/>
  </g>

  <!-- Central I -->
  <path d="M455 438 L569 438 L548 462 L548 650 L575 681 L449 681 L476 650 L476 462 Z"
        fill="url(#gold)" filter="url(#shadow)"/>

  <!-- Blue focal dot -->
  <circle cx="512" cy="370" r="38" fill="#0B74FF" opacity=".55" filter="url(#glow)"/>
  <circle cx="512" cy="370" r="25" fill="url(#blue)"/>

  <!-- Wordmark -->
  <text x="512" y="850" text-anchor="middle"
        font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="650" letter-spacing="2" fill="url(#gold)">Isoltra</text>

  <!-- Tagline -->
  <text x="512" y="916" text-anchor="middle"
        font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif"
        font-size="31" font-weight="400" letter-spacing="5" fill="#F5E8B4">Music in sync. Worship in flow.</text>
</svg>

